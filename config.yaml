seed: 42

paths:
  train_dir: dataset/train
  test_dir: dataset/test
  output_dir: output
  model_dir: models
  cache_dir: cache

blocking:
  max_candidates_per_source1: 500
  name_prefix_lengths: [4, 6]
  use_country: true
  use_postal: true
  use_city: true
  use_street_number: true
  use_name_token: true

training:
  validation_fraction: 0.15
  max_positive_per_source1: 20
  hard_negatives_per_source1: 40
  max_training_rows: 500000
  threshold_min: 0.30
  threshold_max: 0.95
  threshold_step: 0.02

matching:
  default_threshold: 0.70
  low_name_similarity_floor: 0.35
  low_address_similarity_floor: 0.20
